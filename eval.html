<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évaluation INTERVENIR - SST</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .setup-zone {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
        }
        .setup-zone textarea {
            width: 100%;
            height: 60px;
            margin-top: 5px;
            box-sizing: border-box;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        
        /* Zone des rôles */
        .roles-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .role-card {
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s ease;
        }
        .role-sst { background-color: #019E53; grid-column: span 3; font-size: 1.4em; } /* SST en grand au début */
        .role-victime { background-color: #d9534f; }
        .role-temoin { background-color: #0275d8; }
        
        /* Ajustement quand tout est dévoilé */
        .roles-box.revealed {
            grid-template-columns: repeat(3, 1fr);
        }
        .roles-box.revealed .role-sst {
            grid-column: span 1;
            font-size: 1.2em;
        }

        .role-name {
            display: block;
            font-size: 1.3em;
            margin-top: 5px;
            background: rgba(0,0,0,0.15);
            padding: 5px;
            border-radius: 4px;
        }

        /* Zone secrète masquée */
        .secret-content {
            display: none;
            border: 2px dashed #F4912D;
            padding: 15px;
            border-radius: 8px;
            background: #fffdfa;
            margin-top: 20px;
        }

        #scenario-image {
            max-width: 100%;
            max-height: 380px;
            margin: 20px auto;
            display: block;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #question {
            font-size: 1.3em;
            font-weight: bold;
            margin: 15px 0;
            color: #019E53;
        }
        #scenario-text {
            font-size: 1.1em;
            margin: 15px 0;
            color: #333;
            line-height: 1.5;
            text-align: left;
            background: #fcfcfc;
            padding: 15px;
            border-left: 4px solid #F4912D;
        }
        
        /* Boutons */
        button {
            background-color: #F4912D;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        button:hover { background-color: #e07b21; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #action-reveal-btn {
            background-color: #e67e22;
            font-size: 1.2em;
            padding: 15px 30px;
            width: 100%;
            margin: 20px 0;
        }
        #action-reveal-btn:hover { background-color: #d35400; }
        #current-scenario {
            font-size: 1.2em;
            margin: 10px 0;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Évaluation INTERVENIR - SST</h1>

        <!-- Configuration initiale -->
        <div id="setup-area" class="setup-zone">
            <label style="font-weight: bold;">Prénoms des stagiaires (séparés par des virgules ou retours à la ligne) :</label>
            <textarea id="stagiaires-input">Alice, Bob, Charlie, Damien, Élise, Farid, Gaëlle, Hugo, Inès, Julie</textarea>
            <button id="start-btn" style="background-color: #019E53; margin-top: 10px; width: 100%;">Générer et lancer la session d'évaluation</button>
        </div>

        <!-- Zone d'évaluation active -->
        <div id="eval-area" style="display: none;">
            <div id="current-scenario">Tour 1 / 10</div>
            
            <!-- Zone des rôles dynamique -->
            <div id="roles-wrapper" class="roles-box">
                <div class="role-card role-sst">SST DESIGNÉ <span id="sst-name" class="role-name">-</span></div>
                <div id="card-vic" class="role-card role-victime" style="display: none;">VICTIME <span id="victime-name" class="role-name">-</span></div>
                <div id="card-tem" class="role-card role-temoin" style="display: none;">TÉMOIN <span id="temoin-name" class="role-name">-</span></div>
            </div>

            <!-- Grand bouton intermédiaire pour le formateur -->
            <button id="action-reveal-btn">👉 Le SST est sorti ? Dévoiler la situation</button>

            <!-- Contenu caché au SST -->
            <div id="secret-zone" class="secret-content">
                <img id="scenario-image" src="" alt="Illustration du scénario">
                <div id="question"></div>
                <div id="scenario-text"></div>
            </div>
            
            <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px;">
                <button id="prev-btn">⏮ Tour Précédent</button>
                <button id="next-btn">Tour Suivant ⏭</button>
            </div>
        </div>
    </div>

    <script>
        let rawScenarios = []; 
        let evaluationTurns = []; 
        let currentTurnIndex = 0;
        let isRevealed = false;

        // Chargement du fichier JSON
        fetch('EVALUATION_INTERVENIR.json')
            .then(response => {
                if (!response.ok) throw new Error("Fichier JSON introuvable.");
                return response.json();
            })
            .then(data => {
                if (data && data.EVALUATION_INTERVENIR && data.EVALUATION_INTERVENIR.scenarios) {
                    rawScenarios = data.EVALUATION_INTERVENIR.scenarios;
                }
            })
            .catch(error => console.error("Erreur :", error));

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Clic Lancement
        document.getElementById('start-btn').addEventListener('click', () => {
            let inputTech = document.getElementById('stagiaires-input').value;
            let stagiaires = inputTech.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);

            if (stagiaires.length < 3) {
                alert("Il faut au moins 3 stagiaires !");
                return;
            }
            if (rawScenarios.length === 0) {
                alert("Le fichier JSON n'est pas prêt.");
                return;
            }

            let shuffledStagiaires = shuffle([...stagiaires]);
            let shuffledScenarios = shuffle([...rawScenarios]);
            let N = shuffledStagiaires.length;
            evaluationTurns = [];

            for (let i = 0; i < N; i++) {
                evaluationTurns.push({
                    sst: shuffledStagiaires[i],
                    victime: shuffledStagiaires[(i + 1) % N],
                    temoin: shuffledStagiaires[(i + 2) % N],
                    scenario: shuffledScenarios[i % shuffledScenarios.length]
                });
            }

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('eval-area').style.display = 'block';
            
            currentTurnIndex = 0;
            prepareTurn(currentTurnIndex);
        });

        // Étape 1 : On prépare le tour en masquant le secret
        function prepareTurn(index) {
            if (evaluationTurns.length === 0 || index < 0 || index >= evaluationTurns.length) return;
            currentTurnIndex = index;
            isRevealed = false;

            const turn = evaluationTurns[index];
            
            // On affiche uniquement le SST en grand
            document.getElementById('sst-name').textContent = turn.sst;
            document.getElementById('current-scenario').textContent = `Tour ${index + 1} / ${evaluationTurns.length}`;

            // On cache le reste (boutons, cartes et scénario)
            document.getElementById('roles-wrapper').classList.remove('revealed');
            document.getElementById('card-vic').style.display = 'none';
            document.getElementById('card-tem').style.display = 'none';
            document.getElementById('secret-zone').style.display = 'none';
            
            // On réaffiche le bouton d'action principal
            document.getElementById('action-reveal-btn').style.display = 'block';

            // Navigation générale
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === evaluationTurns.length - 1);
        }

        // Étape 2 : Le formateur clique pour dévoiler la suite au reste de la classe
        document.getElementById('action-reveal-btn').addEventListener('click', revealSituation);

        function revealSituation() {
            if (isRevealed || evaluationTurns.length === 0) return;
            isRevealed = true;

            const turn = evaluationTurns[currentTurnIndex];

            // Remplir la victime et le témoin
            document.getElementById('victime-name').textContent = turn.victime;
            document.getElementById('temoin-name').textContent = turn.temoin;

            // Remplir le scénario
            const sc = turn.scenario;
            const imgElement = document.getElementById('scenario-image');
            if (sc.libelle_image) {
                imgElement.src = `images/${sc.libelle_image}`;
                imgElement.style.display = "block";
            } else {
                imgElement.style.display = "none";
            }
            document.getElementById('question').textContent = sc.question || '';
            document.getElementById('scenario-text').textContent = sc.texte_scenario || '';

            // Animations graphiques d'affichage
            document.getElementById('roles-wrapper').classList.add('revealed');
            document.getElementById('card-vic').style.display = 'block';
            document.getElementById('card-tem').style.display = 'block';
            document.getElementById('secret-zone').style.display = 'block';
            
            // Masquer le bouton de révélation devenu inutile pour ce tour
            document.getElementById('action-reveal-btn').style.display = 'none';
        }

        // Boutons de changement de tour
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentTurnIndex > 0) prepareTurn(currentTurnIndex - 1);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentTurnIndex < evaluationTurns.length - 1) prepareTurn(currentTurnIndex + 1);
        });

        // Clavier : La flèche droite prépare le tour suivant, Espace ou Entrée dévoile la situation
        document.addEventListener('keydown', (event) => {
            if (evaluationTurns.length === 0) return;
            if (event.key === 'ArrowLeft' && currentTurnIndex > 0) {
                prepareTurn(currentTurnIndex - 1);
            } else if (event.key === 'ArrowRight' && currentTurnIndex < evaluationTurns.length - 1) {
                prepareTurn(currentTurnIndex + 1);
            } else if ((event.key === ' ' || event.key === 'Enter') && !isRevealed) {
                event.preventDefault(); // évite le scroll de la barre d'espace
                revealSituation();
            }
        });
    </script>
</body>
</html>
